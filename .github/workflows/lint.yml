name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          core: false
          cask: false
          test-bot: false

      - uses: Homebrew/actions/cache-homebrew-prefix@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          install: zsh
          uninstall: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax check Brewfiles (ruby -c)
        run: |
          ruby -c .Brewfile-base
          ruby -c .Brewfile-kiosk
          ruby -c .Brewfile-production

      - name: Syntax check .zshrc (zsh -n)
        run: zsh -n .zshrc

      - name: Syntax check config.sh (bash -n)
        run: bash -n config.sh

      - name: Syntax check .hyper.js (node -c)
        run: node -c .hyper.js

